name: render

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "What the video should show"
        required: true
      model:
        description: "Claude model"
        default: "claude-opus-5-5"

permissions:
  contents: read
  id-token: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Claude writes the video
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Read CLAUDE.md, then edit the Remotion project under src/ so the composition `Main` shows this:
            ${{ inputs.prompt }}
            Run `npx tsc` to check types before finishing.
          claude_args: "--model ${{ inputs.model }} --allowedTools Read,Edit,Write,Glob,Grep,Bash(npx tsc)"

      - name: Render
        run: npm run render

      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            out/video.mp4
            src/
