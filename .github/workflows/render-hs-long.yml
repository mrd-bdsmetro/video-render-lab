name: render-hs-long

# Renders the long HS explainer (composition HsExplainerLong) from the committed voice-over. No secrets needed.
on:
  workflow_dispatch:
  push:
    branches: [feat/hs-long-explainer]
    paths: [".github/workflows/render-hs-long.yml", "src/hs-explainer-long/**", "public/hs-explainer-long/**"]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx remotion render src/index.ts HsExplainerLong out/hs-explainer-long.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: hs-explainer-long
          path: out/hs-explainer-long.mp4
          retention-days: 14
